# Production candidate. No default domain, database, secrets or image tag.
# Local rehearsal uses the same services with a loopback-only ports override.
name: mq-${MQ_DEPLOYMENT_ENV:?Choose staging or production}

x-log: &bounded-log
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_DB: ${MQ_DATABASE_NAME:?Match the deployment manifest}
      POSTGRES_USER: mq_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_messages=warning
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_line_prefix=%m [%p] %e
      - -c
      - shared_buffers=192MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
    secrets: [postgres_password]
    volumes:
      # PG18's PGDATA is beneath this parent, not the pre-18 /data mount.
      - database:/var/lib/postgresql
    networks: [database]
    shm_size: 128m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging: *bounded-log
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -q -U mq_bootstrap -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${MQ_APP_IMAGE:?Use a reviewed immutable image digest}
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      MQ_DEPLOYMENT_ENV: ${MQ_DEPLOYMENT_ENV:?Choose staging or production}
      MQ_DEPLOYMENT_CONFIG: /etc/mq/deployment.json
      AUTH_ORIGIN: ${MQ_AUTH_ORIGIN:?Match the manifest HTTPS origin}
      AUTH_ALLOW_LOCAL_HTTP: "false"
      MQ_AUTH_ENABLED: ${MQ_AUTH_ENABLED:-false}
      MQ_MEDIA_ENABLED: ${MQ_MEDIA_ENABLED:-false}
      MQ_MEDIA_ENV: ${MQ_DEPLOYMENT_ENV:?Choose staging or production}
      MQ_PUBLISH_ENABLED: ${MQ_PUBLISH_ENABLED:-false}
      MQ_COMMENTS_ENABLED: ${MQ_COMMENTS_ENABLED:-false}
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      SESSION_STORAGE_KEY_FILE: /run/secrets/session_storage_key
      AUTH_PROXY_SECRET_FILE: /run/secrets/auth_proxy_secret
      MQ_PUBLISH_SIGNING_KEY_FILE: /run/secrets/publish_signing_key
      MQ_COMMENT_SIGNING_KEY_FILE: /run/secrets/comment_signing_key
    configs:
      - source: deployment
        target: /etc/mq/deployment.json
    secrets: [database_url, auth_secret, session_storage_key, auth_proxy_secret, publish_signing_key, comment_signing_key]
    volumes: [media:/var/lib/mq/media]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"
      - "/app/.next/cache:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"
    networks: [frontend, database]
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    ulimits: { nofile: { soft: 4096, hard: 4096 } }
    logging: *bounded-log
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, scripts/production/healthcheck.mjs]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  proxy:
    image: ${MQ_PROXY_IMAGE:?Use the reviewed proxy image digest}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      MQ_DEPLOYMENT_ENV: ${MQ_DEPLOYMENT_ENV:?Choose staging or production}
      MQ_PUBLIC_HOST: ${MQ_PUBLIC_HOST:?Set the approved public hostname}
      MQ_TLS_MODE: public
      AUTH_PROXY_SECRET_FILE: /run/secrets/auth_proxy_secret
    secrets: [auth_proxy_secret]
    volumes: [caddy-data:/data, caddy-config:/config]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700"]
    networks: [edge, frontend]
    ports: ["80:80", "443:443"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *bounded-log
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }

  # No elevated connection or password is mounted by default. Each offline
  # operation uses a reviewed, one-time override for its own identity only.
  tools:
    profiles: [maintenance]
    image: ${MQ_TOOLS_IMAGE:?Use the corresponding maintenance image digest}
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MQ_DEPLOYMENT_ENV: ${MQ_DEPLOYMENT_ENV:?Choose staging or production}
      MQ_DEPLOYMENT_CONFIG: /etc/mq/deployment.json
    configs:
      - source: deployment
        target: /etc/mq/deployment.json
    volumes: [media:/var/lib/mq/media]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"]
    networks: [database]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *bounded-log
    depends_on:
      postgres: { condition: service_healthy }

  # Explicit one-time preparation of fresh named-volume roots. No recursive
  # ownership changes, database network, credentials or application process.
  volumes-init:
    profiles: [maintenance]
    image: ${MQ_APP_IMAGE:?Use a reviewed immutable image digest}
    user: "0:0"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        for directory in /var/lib/mq/media /data /config; do
          test -d "$$directory" && test ! -L "$$directory"
          case "$$(stat -c %u "$$directory")" in 0|10001) ;; *) exit 1 ;; esac
          chown 10001:10001 "$$directory"
          chmod 0700 "$$directory"
        done
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes: [media:/var/lib/mq/media, caddy-data:/data, caddy-config:/config]
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 16
    logging: *bounded-log

configs:
  deployment:
    file: ${MQ_DEPLOYMENT_CONFIG:?Absolute path to the nonsecret deployment manifest}

# Compose file secrets are bind mounts. Prepare these outside Git as UID10001
# 0400 files; uid/mode declarations cannot fix host bind-mount permissions.
secrets:
  postgres_password: { file: "${MQ_SECRET_DIRECTORY:?Private secret directory}/postgres_password" }
  database_url: { file: "${MQ_SECRET_DIRECTORY:?Private secret directory}/database_url" }
  auth_secret: { file: "${MQ_SECRET_DIRECTORY:?Private secret directory}/auth_secret" }
  session_storage_key: { file: "${MQ_SECRET_DIRECTORY:?Private secret directory}/session_storage_key" }
  auth_proxy_secret: { file: "${MQ_SECRET_DIRECTORY:?Private secret directory}/auth_proxy_secret" }
  publish_signing_key: { file: "${MQ_SECRET_DIRECTORY:?Private secret directory}/publish_signing_key" }
  comment_signing_key: { file: "${MQ_SECRET_DIRECTORY:?Private secret directory}/comment_signing_key" }

volumes:
  database:
  media:
  caddy-data:
  caddy-config:

networks:
  edge:
  frontend: { internal: true }
  database: { internal: true }
