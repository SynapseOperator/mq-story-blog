# Explicitly local HTTP demo. Production still uses compose.production.yaml,
# its secret-file loader, HTTPS and reviewed release plans.
x-tool: &tool
  image: ${MQ_DEMO_TOOLS_IMAGE:?}
  entrypoint: ["node"]
  working_dir: /app
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=128m,mode=1777", "/var/lib/postgresql:size=1m,mode=0700"]
  networks: [database]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  prepare:
    <<: *tool
    profiles: [setup]
    user: "0:0"
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: [scripts/demo/prepare.mjs]
    environment:
      MQ_DEMO_ID: ${MQ_DEMO_ID:?}
      MQ_DEMO_PORT: ${MQ_DEMO_PORT:?}
    volumes:
      - runtime:/run/mq-demo/runtime
      - setup:/run/mq-demo/setup
      - pg-secret:/run/mq-demo/postgres
      - media:/var/lib/mq-demo
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_USER: mq_bootstrap
      POSTGRES_DB: mq_staging_${MQ_DEMO_SUFFIX:?}
      POSTGRES_PASSWORD_FILE: /run/mq-demo/postgres/password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB, -c, log_error_verbosity=terse, -c, log_min_messages=warning, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_statement=none, -c, log_min_duration_statement=-1, -c, log_min_duration_sample=-1, -c, log_transaction_sample_rate=0, -c, "log_line_prefix=%m [%p] %e "]
    volumes: ["database:/var/lib/postgresql", "pg-secret:/run/mq-demo/postgres:ro"]
    networks: [database]
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mq_bootstrap -d mq_staging_${MQ_DEMO_SUFFIX}"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  initialize:
    <<: *tool
    profiles: [setup]
    command: [scripts/demo/initialize.mjs]
    volumes: ["setup:/run/mq-demo/setup"]
    mem_limit: 768m
    cpus: 1.0
    # The interactive credentials command reuses this helper. Its stdout is
    # captured by the host, never retained in Docker's logging driver.
    logging: {driver: none}
  seed:
    <<: *tool
    profiles: [setup]
    command: [scripts/demo/seed.mjs]
    volumes: ["setup:/run/mq-demo/setup"]
    mem_limit: 512m
    cpus: 1.0
  app:
    <<: *tool
    networks: [database, frontend]
    command: [scripts/demo/start.mjs]
    volumes: ["runtime:/run/mq-demo/runtime:ro", "media:/var/lib/mq-demo"]
    tmpfs: ["/tmp:size=128m,mode=1777", "/app/.next/cache:size=64m,uid=10001,gid=10001,mode=0700", "/var/lib/postgresql:size=1m,mode=0700"]
    ports: ["127.0.0.1:${MQ_DEMO_PORT:?}:3000"]
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/stories',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
networks:
  database: {internal: true}
  frontend: {}
volumes:
  database:
  media:
  runtime:
  setup:
  pg-secret:
