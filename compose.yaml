# Local development only. Production credentials and infrastructure are separate.
services:
  postgres-dev:
    image: postgres:18.6-bookworm
    # Keep in sync with config/postgresql/log-privacy.conf; verified by unit tests.
    command:
      - postgres
      - -c
      - "log_destination=stderr"
      - -c
      - "log_error_verbosity=terse"
      - -c
      - "log_min_messages=warning"
      - -c
      - "log_min_error_statement=panic"
      - -c
      - "log_parameter_max_length=0"
      - -c
      - "log_parameter_max_length_on_error=0"
      - -c
      - "log_statement=none"
      - -c
      - "log_min_duration_statement=-1"
      - -c
      - "log_min_duration_sample=-1"
      - -c
      - "log_transaction_sample_rate=0"
      - -c
      - "log_line_prefix=%m [%p] %e "
    environment:
      POSTGRES_DB: mq_development
      POSTGRES_USER: mq_dev
      POSTGRES_PASSWORD: ${MQ_DEV_PASSWORD:?Run npm run db:env first}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker beneath this volume.
      - dev-data:/var/lib/postgresql
    networks: [dev-network]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mq_dev -d mq_development"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-test:
    image: postgres:18.6-bookworm
    # Keep in sync with config/postgresql/log-privacy.conf; verified by unit tests.
    command:
      - postgres
      - -c
      - "log_destination=stderr"
      - -c
      - "log_error_verbosity=terse"
      - -c
      - "log_min_messages=warning"
      - -c
      - "log_min_error_statement=panic"
      - -c
      - "log_parameter_max_length=0"
      - -c
      - "log_parameter_max_length_on_error=0"
      - -c
      - "log_statement=none"
      - -c
      - "log_min_duration_statement=-1"
      - -c
      - "log_min_duration_sample=-1"
      - -c
      - "log_transaction_sample_rate=0"
      - -c
      - "log_line_prefix=%m [%p] %e "
    environment:
      POSTGRES_DB: mq_test
      POSTGRES_USER: mq_test
      POSTGRES_PASSWORD: ${MQ_TEST_PASSWORD:?Run npm run db:env first}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - test-data:/var/lib/postgresql
    networks: [test-network]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mq_test -d mq_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  dev-data:
  test-data:

networks:
  dev-network:
  test-network:
