name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; reviewed in V1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; reviewed in V1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Setup npm
        run: npm install --global npm@11.17.0
      - name: Verify package manager
        run: test "$(npm --version)" = "11.17.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Linux scrypt cost and bounded concurrency measurements
        run: npm run test:auth:hash
      - name: Production build
        run: npm run build

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: mq_test
          POSTGRES_USER: mq_test
          # Only this disposable, loopback-only GitHub runner service uses trust.
          # Local Compose services use independent random passwords with SCRAM.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mq_test -d mq_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --memory 512m
          --cpus 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; reviewed in V1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; reviewed in V1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Setup npm
        run: npm install --global npm@11.17.0
      - name: Verify package manager
        run: test "$(npm --version)" = "11.17.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Configure disposable PostgreSQL error log privacy
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: node scripts/db/configure-ci-logging.mjs
      - name: Validate schema and generate Prisma client
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: |
          npm run db:validate
          npm run db:generate
      - name: Empty database migrations and PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:db
      - name: Media migration, immutable revision references and PostgreSQL locking
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:media
      - name: Deployment identities, empty migrations and all SECURITY DEFINER owners
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:production:db
      - name: Atomic framework limiter concurrency regression
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:auth:limiter
      - name: Offline administrator maintenance with deployment identities
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:production:admin
      - name: Session token compatibility spike and isolated credential rotation
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: |
          npm run test:auth:session-spike
          npm run test:production:rotation
      - name: PostgreSQL log disclosure controls and negative control
        run: npm run test:auth:logs
      - name: Bounded authentication transaction acquisition regression
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:auth:transactions
      - name: Production build for real HTTP authentication tests
        run: npm run build
      - name: Isolated PostgreSQL authentication, concurrency and HTTPS tests
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:auth
      - name: Singleton administrator, least privilege and real HTTP authorization
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:admin
      - name: Protected drafts, column privileges, transaction rollback and public-sharing isolation
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:admin-drafts
      - name: Install Chromium for private editor browser regression
        run: npx playwright install --with-deps chromium
      - name: Private editor PostgreSQL, HTTPS and desktop/mobile browser regression
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:admin-editor
      - name: Private feather-letter preview, zero writes and browser privacy regression
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:admin-preview
      - name: Published-story privacy and real PostgreSQL HTTP tests
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:public
      - name: Persistent likes, database sessions and nested-login browser regression
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:likes
      - name: Moderated comments, HTTP/HTTPS privacy and production browser workflows
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:comments
      - name: Private media uploads, recovery, HTTP and HTTPS authorization
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:media:upload
      - name: Managed story images, private preview and public revision isolation
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
        run: npm run test:media:stories
      - name: Controlled publishing, signed database authority and public HTTP/browser transitions
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
          MQ_PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:publishing
      - name: Media deletion, recovery and isolated database/file restore
        env:
          TEST_DATABASE_URL: postgresql://mq_test@127.0.0.1:5432/mq_test
          MQ_PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:media:lifecycle
      - name: Create isolated local-style development and test databases
        run: |
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}'
          docker compose version
          npm run db:env
          npm run db:up
      - name: Verify isolation, restart and container recreation persistence
        run: npm run test:db:persistence
      - name: Stop project databases while preserving their volumes
        if: always()
        run: |
          if [ -f .env.db.local ]; then
            npm run db:down
          fi

  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Isolated Docker with OCI image-store support
        # The hosted runner's legacy store cannot load OCI indexes. This action
        # starts its own job-scoped daemon/context and tears it down afterwards;
        # it does not change the host daemon or any VPS configuration.
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true},"debug":false}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked toolchain
        run: |
          # Keep this job's full locked Node toolchain in bounded RAM, instead
          # of duplicating it on the small hosted disk beside the tool images.
          # This does not change the app images or the 8GiB disk reserve gate.
          test ! -e node_modules && test ! -L node_modules
          mkdir node_modules
          sudo mount -t tmpfs -o "size=1200m,uid=$(id -u),gid=$(id -g),mode=0700,exec,nodev,nosuid" \
            "mq-node-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$PWD/node_modules"
          export npm_config_cache="$RUNNER_TEMP/mq-npm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$npm_config_cache"
          trap 'rm -rf -- "$npm_config_cache"' EXIT
          npm install --global npm@11.17.0
          npm ci
          # The existing lab launches headless Chromium without a channel.
          npx playwright install --with-deps --only-shell chromium
          du -sh node_modules "$npm_config_cache"
      - name: Build production candidate images without credentials
        run: |
          # A dedicated builder shares layers across these targets. Once loaded,
          # remove only this job's builder/cache before the disk-reserve test.
          # Never prune the daemon or remove unrelated runner directories.
          builder="mq-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          trap 'docker buildx rm "$builder"' EXIT
          docker buildx build --builder "$builder" --load --target app -t mq-p302-app:local .
          docker buildx build --builder "$builder" --load --target tools -t mq-p302-tools:local .
          docker buildx build --builder "$builder" --load --target proxy -t mq-p302-proxy:local .
          docker buildx build --builder "$builder" --load --target operations -t mq-p303-operations:local .
          docker buildx rm "$builder"
          trap - EXIT
          df -h .
      - name: OCI candidate integrity and actual digest-based image execution
        run: npm run test:release
      - name: Release only this job's finished BuildKit image
        # Both named builders are already gone. No force, daemon-wide prune,
        # removal of preinstalled tools, or lowered reserve threshold.
        run: |
          docker image rm moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          df -h .
      - name: Synthetic HTTPS deployment, least privilege and browser regression
        # Includes every original container check, then encrypted recovery and
        # real SCRAM/TLS rotation. No duplicate build or omitted regression.
        run: npm run test:production:operations
      - name: Linux host classification and simulated HTTPS alert delivery
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0700 \
            mq-p303-operations:local --test tests/production-host-preflight.test.mjs tests/production-host-native.test.mjs tests/production-alert-webhook.test.mjs tests/production-external-alerts.test.mjs
      - name: Production contract bootstrap, disabled ingress and protected maintenance
        run: npm run test:production:bootstrap
      - name: Root maintenance reads UID10001 receipts without weakening secret permissions
        run: |
          docker run --rm --network none --read-only --user 0:0 --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            --tmpfs /tmp:rw,nosuid,size=32m,mode=1777 \
            mq-p303-operations:local --test scripts/production/backup-window-root-tests.mjs scripts/release/production-host-tests.mjs tests/production-release-plan.test.mjs
      - name: S3 HTTPS recovery, release containment and application rollback
        run: |
          docker pull ghcr.io/getmoto/motoserver:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
          df -h .
          npm run test:production:release
      - name: Ubuntu OpenSSH include and connection-specific authentication policy
        # Synthetic keys/configuration inside one disposable container only.
        run: node scripts/production/ssh-hardening-tests.mjs
      - name: Unmount only this job's temporary Node toolchain
        if: always()
        run: |
          if mountpoint -q "$GITHUB_WORKSPACE/node_modules"; then
            test "$(findmnt -n -o FSTYPE --target "$GITHUB_WORKSPACE/node_modules")" = tmpfs
            test "$(findmnt -n -o SOURCE --target "$GITHUB_WORKSPACE/node_modules")" = "mq-node-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            sudo umount "$GITHUB_WORKSPACE/node_modules"
          fi
      # Lab credentials, database volumes and backups stay on this disposable
      # runner. No secret-bearing directory is uploaded as an artifact.
